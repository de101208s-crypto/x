
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0b0b0d;

    font-family:
        "M PLUS Rounded 1c",
        "Segoe UI Rounded",
        "Hiragino Maru Gothic ProN",
        "Yu Gothic UI",
        "Noto Sans JP",
        "Quicksand",
        sans-serif;

    color: white;
}

button {
    font-family: inherit;
}

.rounded-num {
    font-family:
        "Fredoka",
        "M PLUS Rounded 1c",
        "Segoe UI Rounded",
        "Hiragino Maru Gothic ProN",
        "Yu Gothic UI",
        "Quicksand",
        sans-serif;

    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum" 1;
}


/* =========================================================
   全体
========================================================= */

.dashboard {
    width: 100vw;
    height: 100vh;

    display: flex;
    flex-direction: row;

    background: #0b0b0d;
}

.col {
    position: relative;
    height: 100%;
    overflow: hidden;
}

.left-col {
    flex: 1 1 auto;
}

.right-col {
    flex: 0 0 clamp(300px, 30vw, 420px);

    position: relative;

    padding: 20px;
}


/* =========================================================
   左ページ
========================================================= */

.col-pages {
    width: 100%;
    height: 100%;

    overflow-y: auto;
    overflow-x: hidden;

    scroll-snap-type: y mandatory;

    scrollbar-width: none;

    overscroll-behavior: none;

    -webkit-overflow-scrolling: touch;
}

.col-pages::-webkit-scrollbar {
    display: none;
}

.col-page {
    width: 100%;
    height: 100%;
    min-height: 100%;

    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    scroll-snap-align: start;
    scroll-snap-stop: always;

    overflow: hidden;

    padding: 20px;
}

.page-label {
    position: absolute;

    top: 24px;
    left: 28px;

    font-size: clamp(13px, 1.6vw, 18px);

    color: rgba(255,255,255,0.4);

    letter-spacing: 2px;
}


/* =========================================================
   左インジケーター
========================================================= */

.left-indicator,
.right-indicator {

    position: absolute;

    top: 50%;

    transform: translateY(-50%);

    z-index: 50;

    display: flex;
    flex-direction: column;

    gap: 9px;
}

.left-indicator {
    left: 18px;
}


.scroll-dot {
    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: rgba(255,255,255,0.25);

    transition:
        background 0.2s,
        transform 0.2s;
}

.scroll-dot.active {
    background: white;

    transform: scale(1.45);
}


/* =========================================================
   パネル
========================================================= */

.panel {
    border-radius: 28px;

    overflow: hidden;

    box-shadow:
        0 25px 70px rgba(0,0,0,0.45);

    border:
        1px solid rgba(255,255,255,0.14);

    position: relative;

    flex-shrink: 0;
}


/* =========================================================
   CLOCK
========================================================= */

.clock-panel {

    background:
        radial-gradient(
            circle at 50% 40%,
            #232323 0%,
            #111 70%
        );

    display: flex;

    align-items: center;
    justify-content: center;

    flex-direction: column;

    padding:
        clamp(30px,4vw,50px)
        clamp(40px,6vw,70px);
}

.clock-time {

    display: grid;

    grid-template-columns:
        max-content
        max-content
        max-content;

    grid-template-rows:
        auto
        auto;

    column-gap: 8px;

    align-items: start;

    line-height: 0.82;

    user-select: none;
}

.clock-hours,
.clock-minutes,
.clock-seconds {

    display: inline-block;

    width: 2ch;

    text-align: center;
}

.clock-colon {

    display: inline-block;

    width: 0.7ch;

    text-align: center;
}

.clock-hours {

    grid-column: 1;
    grid-row: 1;

    font-size:
        clamp(80px,15vw,220px);

    font-weight: 500;

    letter-spacing: -2px;

    color: #ff493f;

    text-shadow:
        0 0 18px rgba(255,73,63,0.10);
}

.clock-colon {

    grid-column: 2;
    grid-row: 1;

    font-size:
        clamp(80px,15vw,220px);

    font-weight: 500;

    color: #ffffff;

    line-height: 0.78;
}

.clock-minutes {

    grid-column: 3;
    grid-row: 1;

    font-size:
        clamp(80px,15vw,220px);

    font-weight: 500;

    letter-spacing: -2px;

    color: #aeeeff;

    text-shadow:
        0 0 18px rgba(174,238,255,0.10);
}

.clock-seconds {

    grid-column: 3;
    grid-row: 2;

    justify-self: end;

    margin-top: 10px;

    font-size:
        clamp(80px,15vw,220px);

    font-weight: 500;

    letter-spacing: -2px;

    color: #e8faff;

    text-shadow:
        0 0 18px rgba(232,250,255,0.10);
}

.clock-date {

    margin-top: 22px;

    text-align: center;

    font-size:
        clamp(16px,2vw,22px);

    font-weight: 400;

    color: rgba(255,255,255,0.6);
}


/* =========================================================
   WEATHER
========================================================= */

.right-pages {

    width: 100%;
    height: 100%;

    overflow-y: auto;
    overflow-x: hidden;

    scroll-snap-type: y mandatory;

    scrollbar-width: none;

    overscroll-behavior: none;

    -webkit-overflow-scrolling: touch;
}

.right-pages::-webkit-scrollbar {
    display: none;
}

.right-page {

    width: 100%;
    height: 100%;
    min-height: 100%;

    display: flex;

    align-items: center;
    justify-content: center;

    scroll-snap-align: start;
    scroll-snap-stop: always;

    overflow: hidden;
}


/* =========================================================
   WEATHER CARD
========================================================= */

.weather-panel {

    width: 100%;

    max-width: 320px;

    height: 440px;
    min-height: 440px;
    max-height: 440px;

    padding: 22px 20px;

    display: flex;

    flex-direction: column;

    justify-content: space-between;

    background:
        linear-gradient(
            165deg,
            #6fb1f0 0%,
            #3a7fd6 55%,
            #2e63b0 100%
        );

    transition:
        background 0.6s ease;

    flex-shrink: 0;
}

.weather-top {

    display: flex;

    flex-direction: column;

    gap: 2px;
}

.weather-location {

    font-size: 20px;

    font-weight: 500;

    letter-spacing: 0.2px;
}

.weather-condition-small {

    font-size: 14px;

    font-weight: 400;

    color:
        rgba(255,255,255,0.85);
}

.weather-middle {

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 4px;

    margin: 6px 0;
}

.weather-icon-wrap {

    width: 74px;
    height: 74px;

    display: flex;

    align-items: center;
    justify-content: center;

    flex-shrink: 0;
}

.weather-icon-wrap svg {

    width: 100%;
    height: 100%;
}

.weather-temp {

    font-size: 64px;

    font-weight: 300;

    letter-spacing: -2px;

    line-height: 1;
}

.weather-bottom {

    display: flex;

    flex-direction: column;

    gap: 10px;
}

.weather-divider {

    height: 1px;

    background:
        rgba(255,255,255,0.28);

    width: 100%;
}

.weather-hilo {

    display: flex;

    justify-content: space-between;

    font-size: 15px;

    color:
        rgba(255,255,255,0.9);
}

.weather-hilo span.dim {

    color:
        rgba(255,255,255,0.65);
}

.weather-extra {

    display: flex;

    justify-content: space-between;

    font-size: 13px;

    color:
        rgba(255,255,255,0.7);
}

.weather-updated {

    font-size: 11px;

    color:
        rgba(255,255,255,0.5);

    text-align: right;
}

.weather-error {

    font-size: 12px;

    color: #ffdca8;

    background:
        rgba(0,0,0,0.3);

    border-radius: 10px;

    padding: 8px 10px;

    line-height: 1.5;

    display: none;
}

.weather-error.show {
    display: block;
}

.weather-error a {

    color: #ffe9c2;

    text-decoration: underline;
}


/* =========================================================
   TIMER
========================================================= */

.timer-content {

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    gap:
        clamp(24px,4vw,40px);
}

.timer-time-display {

    display: flex;

    gap: 8px;

    align-items: flex-start;

    line-height: 0.82;

    user-select: none;
}

.timer-time-display.hidden {
    display: none !important;
}

.timer-hours-display,
.timer-minutes-display,
.timer-seconds-display {

    font-size:
        clamp(70px,13vw,170px);

    font-weight: 500;

    width: 2ch;

    text-align: center;
}

.timer-hours-display {

    color: #ff493f;

    text-shadow:
        0 0 18px rgba(255,73,63,0.10);
}

.timer-minutes-display {

    color: #aeeeff;

    text-shadow:
        0 0 18px rgba(174,238,255,0.10);
}

.timer-seconds-display {

    color: #e8faff;

    text-shadow:
        0 0 18px rgba(232,250,255,0.10);
}

.timer-colon-display,
.timer-colon2-display {

    font-size:
        clamp(70px,13vw,170px);

    font-weight: 500;

    color: white;

    width: 0.7ch;

    text-align: center;
}

.time-picker {

    position: relative;

    display: flex;

    align-items: center;
    justify-content: center;

    gap: 5px;

    user-select: none;

    overflow: hidden;

    padding: 15px 20px;

    border-radius: 28px;

    background:
        rgba(255,255,255,0.06);

    border:
        1px solid rgba(255,255,255,0.14);

    box-shadow:
        0 20px 60px rgba(0,0,0,0.25);

    flex-shrink: 0;
}

.time-column {

    position: relative;

    width:
        clamp(60px,8vw,100px);

    height: 180px;

    overflow-y: auto;
    overflow-x: hidden;

    scroll-snap-type: y mandatory;

    scrollbar-width: none;

    flex:
        0 0 clamp(60px,8vw,100px);

    user-select: none;

    touch-action: pan-y;
}

.time-column::-webkit-scrollbar {
    display: none;
}

.wheel-spacer {

    height: 65px;

    flex-shrink: 0;
}

.time-value {

    width: 100%;

    height: 50px;

    display: flex;

    align-items: center;
    justify-content: center;

    scroll-snap-align: center;

    font-size:
        clamp(26px,4vw,44px);

    color:
        rgba(255,255,255,0.28);

    transition:
        color 0.15s,
        transform 0.15s;

    flex-shrink: 0;
}

.time-value.selected {

    color: #ffffff;

    transform: scale(1.15);

    font-weight: 500;

    text-shadow:
        0 0 18px rgba(110,180,255,0.5);
}

.time-separator {

    font-size:
        clamp(28px,4vw,44px);

    color: #9cc9ff;

    text-shadow:
        0 0 12px rgba(80,150,255,0.45);
}

.time-picker::before,
.time-picker::after {

    content: "";

    position: absolute;

    left: 18px;
    right: 18px;

    height: 1px;

    background:
        rgba(150,200,255,0.45);

    pointer-events: none;

    z-index: 5;
}

.time-picker::before {
    top: calc(50% - 25px);
}

.time-picker::after {
    top: calc(50% + 25px);
}

.timer-page.running .time-picker {
    display: none !important;
}

.tool-buttons {

    display: flex;

    align-items: center;

    gap: 12px;
}

.tool-button {

    min-width: 120px;

    padding: 13px 25px;

    border: none;

    border-radius: 30px;

    background:
        rgba(255,255,255,0.12);

    color: white;

    font-size: 17px;

    cursor: pointer;

    border:
        1px solid rgba(255,255,255,0.14);

    box-shadow:
        0 8px 25px rgba(0,0,0,0.15);
}

.tool-button:active {
    transform: scale(0.96);
}

.start-button {

    background:
        linear-gradient(
            135deg,
            #ff6f65,
            #ff493f
        );

    box-shadow:
        0 8px 25px rgba(255,73,63,0.28);
}

.cancel-button {

    background:
        rgba(255,255,255,0.09);
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 900px) {

    .dashboard {
        flex-direction: column;
    }

    .right-col {
        flex: 1 1 auto;
    }
}


/* =========================================================
   1280x720など
========================================================= */

@media (min-width: 1000px)
       and (max-width: 1366px)
       and (max-height: 800px) {

    .clock-panel {

        padding:
            40px 56px;
    }

    .clock-hours,
    .clock-colon,
    .clock-minutes,
    .clock-seconds {

        font-size: 190px;

        letter-spacing: -3px;
    }

    .clock-date {

        margin-top: 18px;

        font-size: 19px;
    }

    .timer-hours-display,
    .timer-minutes-display,
    .timer-seconds-display,
    .timer-colon-display,
    .timer-colon2-display {

        font-size: 150px;
    }

    .weather-panel {

        max-width: 280px;

        height: 440px;
        min-height: 440px;
        max-height: 440px;
    }

    .weather-temp {
        font-size: 58px;
    }
}
</style>
</head>
<body>
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>DesktopThing</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600&family=M+PLUS+Rounded+1c:wght@300;400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="dashboard">

    <!-- 左：時計・タイマー -->
    <div class="col left-col">

        <div class="col-pages" id="leftPages">

            <!-- CLOCK -->
            <section class="col-page">

                <div class="panel clock-panel">

                    <div class="clock-time">

                        <div class="clock-hours rounded-num" id="clockHours">00</div>

                        <div class="clock-colon rounded-num">:</div>

                        <div class="clock-minutes rounded-num" id="clockMinutes">00</div>

                        <div class="clock-seconds rounded-num" id="clockSeconds">00</div>

                    </div>

                    <div class="clock-date" id="clockDate">
                        Friday, August 21
                    </div>

                </div>

            </section>


            <!-- TIMER -->
            <section class="col-page timer-page" id="timerPage">

                <div class="page-label">TIMER</div>

                <div class="timer-content">

                    <div class="timer-time-display hidden" id="timerTimeDisplay">

                        <div class="timer-hours-display rounded-num" id="timerHoursDisplay">
                            00
                        </div>

                        <div class="timer-colon-display rounded-num">:</div>

                        <div class="timer-minutes-display rounded-num" id="timerMinutesDisplay">
                            00
                        </div>

                        <div class="timer-colon2-display rounded-num">:</div>

                        <div class="timer-seconds-display rounded-num" id="timerSecondsDisplay">
                            00
                        </div>

                    </div>


                    <div class="time-picker" id="timePicker">

                        <div class="time-column" id="timerHours"></div>

                        <div class="time-separator">:</div>

                        <div class="time-column" id="timerMinutes"></div>

                        <div class="time-separator">:</div>

                        <div class="time-column" id="timerSeconds"></div>

                    </div>


                    <div class="tool-buttons">

                        <button class="tool-button cancel-button" id="timerCancel">
                            RESET
                        </button>

                        <button class="tool-button start-button" id="timerStart">
                            START
                        </button>

                    </div>

                </div>

            </section>

        </div>


        <!-- 時計・タイマーの白丸 -->
        <div class="left-indicator" id="leftIndicator">

            <div class="scroll-dot active" data-index="0"></div>
            <div class="scroll-dot" data-index="1"></div>

        </div>

    </div>



    <!-- 右：天気 -->
    <div class="col right-col">

        <div class="right-pages" id="rightPages">


            <!-- ==============================
                 WEATHER
            =============================== -->

            <section class="right-page">

                <div class="panel weather-panel" id="weatherPanel">

                    <div class="weather-top">

                        <div class="weather-location">
                            交野市
                        </div>

                        <div class="weather-condition-small" id="weatherConditionSmall">
                            読み込み中…
                        </div>

                    </div>


                    <div class="weather-middle">

                        <div class="weather-icon-wrap" id="weatherIconWrap"></div>

                        <div class="weather-temp rounded-num" id="weatherTemp">
                            --°
                        </div>

                    </div>


                    <div class="weather-bottom">

                        <div class="weather-error" id="weatherError"></div>

                        <div class="weather-divider"></div>

                        <div class="weather-hilo">

                            <span>
                                <span class="dim">最高</span>
                                <span id="weatherHigh">--°</span>
                            </span>

                            <span>
                                <span class="dim">最低</span>
                                <span id="weatherLow">--°</span>
                            </span>

                        </div>


                        <div class="weather-extra">

                            <span>
                                湿度
                                <span id="weatherHumidity">--%</span>
                            </span>

                            <span>
                                体感
                                <span id="weatherFeels">--°</span>
                            </span>

                        </div>


                        <div class="weather-updated" id="weatherUpdated"></div>

                    </div>

                </div>

            </section>



            

        </div>



    </div>

</div>


<script src="script.js"></script>

</body>
</html>
<script>
/* =========================================================
   CLOCK
========================================================= */

function updateClock() {

    const now = new Date();

    document.getElementById("clockHours").textContent =
        String(now.getHours()).padStart(2, "0");

    document.getElementById("clockMinutes").textContent =
        String(now.getMinutes()).padStart(2, "0");

    document.getElementById("clockSeconds").textContent =
        String(now.getSeconds()).padStart(2, "0");

    const weekdays = [
        "Sunday",
        "Monday",
        "Tuesday",
        "Wednesday",
        "Thursday",
        "Friday",
        "Saturday"
    ];

    const months = [
        "January",
        "February",
        "March",
        "April",
        "May",
        "June",
        "July",
        "August",
        "September",
        "October",
        "November",
        "December"
    ];

    document.getElementById("clockDate").textContent =
        weekdays[now.getDay()] +
        ", " +
        months[now.getMonth()] +
        " " +
        now.getDate();
}

updateClock();

setInterval(updateClock, 1000);


/* =========================================================
   TIMER
========================================================= */

function createWheel(id, max) {

    const column = document.getElementById(id);

    const topSpacer = document.createElement("div");
    topSpacer.className = "wheel-spacer";
    column.appendChild(topSpacer);

    for (let i = 0; i <= max; i++) {

        const value = document.createElement("div");

        value.className =
            "time-value rounded-num";

        value.textContent =
            String(i).padStart(2, "0");

        column.appendChild(value);
    }

    const bottomSpacer = document.createElement("div");
    bottomSpacer.className = "wheel-spacer";
    column.appendChild(bottomSpacer);
}


createWheel("timerHours", 23);
createWheel("timerMinutes", 59);
createWheel("timerSeconds", 59);


function getSelectedIndex(column) {

    const values =
        column.querySelectorAll(".time-value");

    const count = values.length;

    if (count === 0) {
        return 0;
    }

    return Math.max(
        0,
        Math.min(
            count - 1,
            Math.round(column.scrollTop / 50)
        )
    );
}


function updateSelected(column) {

    const values =
        column.querySelectorAll(".time-value");

    const index =
        getSelectedIndex(column);

    values.forEach((value, i) => {

        value.classList.toggle(
            "selected",
            i === index
        );

    });
}


document.querySelectorAll(".time-column").forEach(
    column => {

        let scrollTimer;

        column.addEventListener(
            "scroll",
            () => {

                if (column.scrollLeft !== 0) {
                    column.scrollLeft = 0;
                }

                updateSelected(column);

                clearTimeout(scrollTimer);

                scrollTimer =
                    setTimeout(() => {

                        const index =
                            getSelectedIndex(column);

                        column.scrollTo({
                            top: index * 50,
                            behavior: "smooth"
                        });

                        updateSelected(column);

                    }, 100);

            },
            { passive: true }
        );

        column.scrollLeft = 0;
        column.scrollTop = 0;

        updateSelected(column);
    }
);


const timerPage =
    document.getElementById("timerPage");

const timerStart =
    document.getElementById("timerStart");

const timerCancel =
    document.getElementById("timerCancel");

const timerTimeDisplay =
    document.getElementById("timerTimeDisplay");


let timerSeconds = 0;
let timerInterval = null;
let timerRunning = false;


function getTimerSelectedTime() {

    const hours =
        getSelectedIndex(
            document.getElementById("timerHours")
        );

    const minutes =
        getSelectedIndex(
            document.getElementById("timerMinutes")
        );

    const seconds =
        getSelectedIndex(
            document.getElementById("timerSeconds")
        );

    return (
        hours * 3600 +
        minutes * 60 +
        seconds
    );
}


function updateTimerDisplay() {

    const hours =
        Math.floor(timerSeconds / 3600);

    const minutes =
        Math.floor(
            (timerSeconds % 3600) / 60
        );

    const seconds =
        timerSeconds % 60;

    document.getElementById(
        "timerHoursDisplay"
    ).textContent =
        String(hours).padStart(2, "0");

    document.getElementById(
        "timerMinutesDisplay"
    ).textContent =
        String(minutes).padStart(2, "0");

    document.getElementById(
        "timerSecondsDisplay"
    ).textContent =
        String(seconds).padStart(2, "0");
}


function playTimerSound() {

    try {

        const AudioCtx =
            window.AudioContext ||
            window.webkitAudioContext;

        const ctx =
            new AudioCtx();

        const setIntervalTime = 2.0;
        const setCount = 4;

        const beepOffsets = [
            0,
            0.3,
            0.6
        ];

        for (
            let s = 0;
            s < setCount;
            s++
        ) {

            const setStart =
                s * setIntervalTime;

            beepOffsets.forEach(
                (t, i) => {

                    const osc =
                        ctx.createOscillator();

                    const gain =
                        ctx.createGain();

                    osc.type = "sine";

                    osc.frequency.value =
                        i === 2
                            ? 1046.5
                            : 880;

                    const startTime =
                        ctx.currentTime +
                        setStart +
                        t;

                    gain.gain.setValueAtTime(
                        0.0001,
                        startTime
                    );

                    gain.gain
                        .exponentialRampToValueAtTime(
                            0.35,
                            startTime + 0.02
                        );

                    gain.gain
                        .exponentialRampToValueAtTime(
                            0.0001,
                            startTime + 0.28
                        );

                    osc.connect(gain);
                    gain.connect(ctx.destination);

                    osc.start(startTime);

                    osc.stop(
                        startTime + 0.3
                    );
                }
            );
        }

        setTimeout(
            () => {

                try {
                    ctx.close();
                } catch (e) {}

            },
            (setCount * setIntervalTime + 1) * 1000
        );

    } catch (e) {}
}


timerStart.addEventListener(
    "click",
    () => {

        if (timerRunning) {

            clearInterval(timerInterval);

            timerRunning = false;

            timerStart.textContent =
                "RESUME";

            return;
        }

        if (timerSeconds === 0) {

            timerSeconds =
                getTimerSelectedTime();

            if (timerSeconds <= 0) {
                return;
            }
        }

        timerRunning = true;

        timerPage.classList.add(
            "running"
        );

        timerTimeDisplay.classList.remove(
            "hidden"
        );

        timerStart.textContent =
            "PAUSE";

        updateTimerDisplay();

        timerInterval =
            setInterval(
                () => {

                    timerSeconds--;

                    updateTimerDisplay();

                    if (timerSeconds <= 0) {

                        clearInterval(
                            timerInterval
                        );

                        timerInterval = null;

                        timerRunning = false;

                        timerSeconds = 0;

                        updateTimerDisplay();

                        timerStart.textContent =
                            "START";

                        playTimerSound();
                    }

                },
                1000
            );
    }
);

function bindColumnIndicator(
    pagesId,
    indicatorId
) {

    const pagesEl =
        document.getElementById(pagesId);

    const dots =
        document.querySelectorAll(
            "#" +
            indicatorId +
            " .scroll-dot"
        );

    const pageEls =
        pagesEl.querySelectorAll(
            ".col-page"
        );

    function update() {

        const scrollTop =
            pagesEl.scrollTop;

        const pageHeight =
            pagesEl.clientHeight;

        if (pageHeight <= 0) {
            return;
        }

        let index =
            Math.round(
                scrollTop / pageHeight
            );

        index =
            Math.max(
                0,
                Math.min(
                    pageEls.length - 1,
                    index
                )
            );

        dots.forEach(
            (dot, i) => {

                dot.classList.toggle(
                    "active",
                    i === index
                );
            }
        );
    }

    pagesEl.addEventListener(
        "scroll",
        update,
        { passive: true }
    );

    update();
}

function getWeatherInfo(
    code,
    isDay
) {

    const day =
        isDay === 1;

    if (code === 0) {

        return {

            icon:
                day
                    ? ICONS.sun
                    : ICONS.moon,

            desc: "快晴",

            bg:
                day
                    ? "linear-gradient(165deg,#6fb1f0 0%,#3a7fd6 55%,#2e63b0 100%)"
                    : "linear-gradient(165deg,#14213d 0%,#0b1530 60%,#060a1a 100%)"
        };
    }

    if (code === 1 || code === 2) {

        return {

            icon:
                day
                    ? ICONS.cloudSun
                    : ICONS.cloud,

            desc: "一部くもり",

            bg:
                day
                    ? "linear-gradient(165deg,#7db8e8 0%,#4d84c4 55%,#3a6aa3 100%)"
                    : "linear-gradient(165deg,#262f45 0%,#171d30 60%,#10141f 100%)"
        };
    }

    if (code === 3) {

        return {

            icon: ICONS.cloud,

            desc: "くもり",

            bg:
                day
                    ? "linear-gradient(165deg,#9aa6b3 0%,#707c89 55%,#58636f 100%)"
                    : "linear-gradient(165deg,#353d4d 0%,#242b39 60%,#171d29 100%)"
        };
    }

    if (code === 45 || code === 48) {

        return {

            icon: ICONS.fog,

            desc: "霧",

            bg:
                day
                    ? "linear-gradient(165deg,#aeb7c0 0%,#89949f 55%,#69747f 100%)"
                    : "linear-gradient(165deg,#303845 0%,#202732 60%,#141922 100%)"
        };
    }

    if (
        [
            51, 53, 55,
            61, 63, 65,
            80, 81, 82
        ].includes(code)
    ) {

        return {

            icon: ICONS.rain,

            desc:
                code >= 80
                    ? "にわか雨"
                    : "雨",

            bg:
                day
                    ? "linear-gradient(165deg,#6f879c 0%,#4b6479 55%,#344958 100%)"
                    : "linear-gradient(165deg,#273445 0%,#182331 60%,#0d151f 100%)"
        };
    }

    if (
        [
            71, 73, 75,
            77, 85, 86
        ].includes(code)
    ) {

        return {

            icon: ICONS.snow,

            desc: "雪",

            bg:
                day
                    ? "linear-gradient(165deg,#b4cce2 0%,#88a9c8 55%,#6687a7 100%)"
                    : "linear-gradient(165deg,#30435a 0%,#223247 60%,#152333 100%)"
        };
    }

    if (
        [
            95, 96, 99
        ].includes(code)
    ) {

        return {

            icon: ICONS.thunder,

            desc: "雷雨",

            bg:
                day
                    ? "linear-gradient(165deg,#596278 0%,#3e465c 55%,#292f42 100%)"
                    : "linear-gradient(165deg,#24283a 0%,#171a2a 60%,#0d0f1b 100%)"
        };
    }

    return {

        icon: ICONS.cloud,

        desc: "不明",

        bg:
            day
                ? "linear-gradient(165deg,#6fb1f0 0%,#3a7fd6 55%,#2e63b0 100%)"
                : "linear-gradient(165deg,#14213d 0%,#0b1530 60%,#060a1a 100%)"
    };
}


function showWeatherError(
    message,
    isHtml
) {

    const el =
        document.getElementById(
            "weatherError"
        );

    if (!el) {
        return;
    }

    if (isHtml) {
        el.innerHTML = message;
    } else {
        el.textContent = message;
    }

    el.classList.add("show");
}


function clearWeatherError() {

    const el =
        document.getElementById(
            "weatherError"
        );

    if (el) {
        el.classList.remove("show");
    }
}


async function requestJson(url) {

    const controller =
        new AbortController();

    const timeout =
        setTimeout(
            () => controller.abort(),
            8000
        );

    try {

        const response =
            await fetch(
                url,
                {
                    mode: "cors",
                    cache: "no-store",
                    signal: controller.signal
                }
            );

        clearTimeout(timeout);

        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );
        }

        return await response.json();

    } catch (fetchError) {

        clearTimeout(timeout);

        return await new Promise(
            (resolve, reject) => {

                try {

                    const xhr =
                        new XMLHttpRequest();

                    xhr.timeout = 8000;

                    xhr.open(
                        "GET",
                        url,
                        true
                    );

                    xhr.onload =
                        function () {

                            if (
                                xhr.status >= 200 &&
                                xhr.status < 300
                            ) {

                                try {

                                    resolve(
                                        JSON.parse(
                                            xhr.responseText
                                        )
                                    );

                                } catch (parseError) {

                                    reject(
                                        new Error(
                                            "JSON解析エラー: " +
                                            parseError.message
                                        )
                                    );
                                }

                            } else {

                                reject(
                                    new Error(
                                        "XHR HTTP " +
                                        xhr.status
                                    )
                                );
                            }
                        };

                    xhr.onerror =
                        function () {

                            reject(
                                new Error(
                                    "ネットワーク到達不可"
                                )
                            );
                        };

                    xhr.ontimeout =
                        function () {

                            reject(
                                new Error(
                                    "通信がタイムアウト"
                                )
                            );
                        };

                    xhr.send();

                } catch (xhrSetupError) {

                    reject(
                        new Error(
                            xhrSetupError.message
                        )
                    );
                }
            }
        );
    }
}


async function updateWeather() {

    try {

        const data =
            await requestJson(
                FORECAST_URL
            );

        const temp =
            Math.round(
                data.current.temperature_2m
            );

        const feels =
            Math.round(
                data.current.apparent_temperature
            );

        const humidity =
            data.current.relative_humidity_2m;

        const code =
            data.current.weather_code;

        const isDay =
            data.current.is_day;

        const high =
            Math.round(
                data.daily.temperature_2m_max[0]
            );

        const low =
            Math.round(
                data.daily.temperature_2m_min[0]
            );

        const info =
            getWeatherInfo(
                code,
                isDay
            );

        document.getElementById(
            "weatherIconWrap"
        ).innerHTML =
            info.icon;

        document.getElementById(
            "weatherConditionSmall"
        ).textContent =
            info.desc;

        document.getElementById(
            "weatherTemp"
        ).textContent =
            temp + "°";

        document.getElementById(
            "weatherHigh"
        ).textContent =
            high + "°";

        document.getElementById(
            "weatherLow"
        ).textContent =
            low + "°";

        document.getElementById(
            "weatherHumidity"
        ).textContent =
            humidity + "%";

        document.getElementById(
            "weatherFeels"
        ).textContent =
            feels + "°";

        document.getElementById(
            "weatherPanel"
        ).style.background =
            info.bg;

        const now =
            new Date();

        document.getElementById(
            "weatherUpdated"
        ).textContent =
            "更新 " +
            String(now.getHours())
                .padStart(2, "0") +
            ":" +
            String(now.getMinutes())
                .padStart(2, "0");

        clearWeatherError();

    } catch (error) {

        document.getElementById(
            "weatherConditionSmall"
        ).textContent =
            "取得できません";

        showWeatherError(
            "取得失敗: " +
            error.message,
            false
        );
    }
}


updateWeather();


function scheduleWeatherUpdate() {

    const now =
        new Date();

    const minutes =
        now.getMinutes();

    const nextMultipleOf5 =
        Math.ceil(
            (minutes + 1) / 5
        ) * 5;

    const next =
        new Date(now);

    next.setMinutes(
        nextMultipleOf5,
        0,
        0
    );

    const delay =
        next.getTime() -
        now.getTime();

    setTimeout(
        () => {

            updateWeather();

            setInterval(
                updateWeather,
                5 * 60 * 1000
            );

        },
        delay
    );
}


scheduleWeatherUpdate();
