<!DOCTYPE html>
<html>
<head>
    <meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}
html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0b0b0d;

    font-family:
        "M PLUS Rounded 1c",
        "Segoe UI Rounded",
        "Hiragino Maru Gothic ProN",
        "Yu Gothic UI",
        "Noto Sans JP",
        "Quicksand",
        sans-serif;

    color: white;
}

button {
    font-family: inherit;
}

.rounded-num {
    font-family:
        "Fredoka",
        "M PLUS Rounded 1c",
        "Segoe UI Rounded",
        "Hiragino Maru Gothic ProN",
        "Yu Gothic UI",
        "Quicksand",
        sans-serif;

    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum" 1;
}


/* =========================================================
   全体
========================================================= */

.dashboard {
    width: 100vw;
    height: 100vh;

    display: flex;
    flex-direction: row;

    background: #0b0b0d;
}

.col {
    position: relative;
    height: 100%;
    overflow: hidden;
}

.left-col {
    flex: 1 1 auto;
}

.right-col {
    flex: 0 0 clamp(300px, 30vw, 420px);

    position: relative;

    padding: 20px;
}


/* =========================================================
   左ページ
========================================================= */

.col-pages {
    width: 100%;
    height: 100%;

    overflow-y: auto;
    overflow-x: hidden;

    scroll-snap-type: y mandatory;

    scrollbar-width: none;

    overscroll-behavior: none;

    -webkit-overflow-scrolling: touch;
}

.col-pages::-webkit-scrollbar {
    display: none;
}

.col-page {
    width: 100%;
    height: 100%;
    min-height: 100%;

    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    scroll-snap-align: start;
    scroll-snap-stop: always;

    overflow: hidden;

    padding: 20px;
}

.page-label {
    position: absolute;

    top: 24px;
    left: 28px;

    font-size: clamp(13px, 1.6vw, 18px);

    color: rgba(255,255,255,0.4);

    letter-spacing: 2px;
}


/* =========================================================
   左インジケーター
========================================================= */

.left-indicator,
.right-indicator {

    position: absolute;

    top: 50%;

    transform: translateY(-50%);

    z-index: 50;

    display: flex;
    flex-direction: column;

    gap: 9px;
}

.left-indicator {
    left: 18px;
}


.scroll-dot {
    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: rgba(255,255,255,0.25);

    transition:
        background 0.2s,
        transform 0.2s;
}

.scroll-dot.active {
    background: white;

    transform: scale(1.45);
}


/* =========================================================
   パネル
========================================================= */

.panel {
    border-radius: 28px;

    overflow: hidden;

    box-shadow:
        0 25px 70px rgba(0,0,0,0.45);

    border:
        1px solid rgba(255,255,255,0.14);

    position: relative;

    flex-shrink: 0;
}


/* =========================================================
   CLOCK
========================================================= */

.clock-panel {

    background:
        radial-gradient(
            circle at 50% 40%,
            #232323 0%,
            #111 70%
        );

    display: flex;

    align-items: center;
    justify-content: center;

    flex-direction: column;

    padding:
        clamp(30px,4vw,50px)
        clamp(40px,6vw,70px);
}

.clock-time {

    display: grid;

    grid-template-columns:
        max-content
        max-content
        max-content;

    grid-template-rows:
        auto
        auto;

    column-gap: 8px;

    align-items: start;

    line-height: 0.82;

    user-select: none;
}

.clock-hours,
.clock-minutes,
.clock-seconds {

    display: inline-block;

    width: 2ch;

    text-align: center;
}

.clock-colon {

    display: inline-block;

    width: 0.7ch;

    text-align: center;
}

.clock-hours {

    grid-column: 1;
    grid-row: 1;

    font-size:
        clamp(80px,15vw,220px);

    font-weight: 500;

    letter-spacing: -2px;

    color: #ff493f;

    text-shadow:
        0 0 18px rgba(255,73,63,0.10);
}

.clock-colon {

    grid-column: 2;
    grid-row: 1;

    font-size:
        clamp(80px,15vw,220px);

    font-weight: 500;

    color: #ffffff;

    line-height: 0.78;
}

.clock-minutes {

    grid-column: 3;
    grid-row: 1;

    font-size:
        clamp(80px,15vw,220px);

    font-weight: 500;

    letter-spacing: -2px;

    color: #aeeeff;

    text-shadow:
        0 0 18px rgba(174,238,255,0.10);
}

.clock-seconds {

    grid-column: 3;
    grid-row: 2;

    justify-self: end;

    margin-top: 10px;

    font-size:
        clamp(80px,15vw,220px);

    font-weight: 500;

    letter-spacing: -2px;

    color: #e8faff;

    text-shadow:
        0 0 18px rgba(232,250,255,0.10);
}

.clock-date {

    margin-top: 22px;

    text-align: center;

    font-size:
        clamp(16px,2vw,22px);

    font-weight: 400;

    color: rgba(255,255,255,0.6);
}


/* =========================================================
   WEATHER
========================================================= */

.right-pages {

    width: 100%;
    height: 100%;

    overflow-y: auto;
    overflow-x: hidden;
